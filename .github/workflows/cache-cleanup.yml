name: Cache Cleanup

on:
  schedule:
    - cron: '0 5 * * SUN'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const list = await github.rest.actions.listArtifactsForRepo({ owner, repo, per_page: 100 });
            const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const stale = list.data.artifacts.filter(a => new Date(a.updated_at) < cutoff);
            for (const art of stale) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
            }
            const result = await github.rest.actions.getRepoCacheUsage ?? null;
      - name: Validate cache health
        run: |
          echo "Cache cleanup complete"