name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - name: Build release
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stardew-view-linux
          path: target/release/libstardew_view.so