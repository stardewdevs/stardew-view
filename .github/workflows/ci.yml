name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev glslang-tools

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features "jni" -- -D warnings

      - name: Build library
        run: cargo build --features "jni"

      - name: Build examples
        run: cargo build --examples --features "jni"

      - name: Run unit tests
        run: cargo test --lib --features "jni"

      - name: Run integration tests
        run: cargo test --test integration --features "jni"
