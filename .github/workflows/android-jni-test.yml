name: Android JNI Test

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/jni/**'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/jni/**'
  workflow_dispatch:

jobs:
  jni-build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r27
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: stable/install-cargo-ndk@v1
      - name: Install NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip
          unzip -q android-ndk-$NDK_VERSION-linux.zip
          sudo mv android-ndk-$NDK_VERSION /opt/android-ndk
      - name: Build JNI library
        run: cargo ndk -t arm64-v8a build --features jni
      - name: Verify JNI exports
        run: |
          nm -D target/aarch64-linux-android/debug/libstardew_view.so | grep "Java_io_stardew" || true
      - name: Copy to android native libs
        run: |
          mkdir -p android/jni
          cp target/aarch64-linux-android/debug/libstardew_view.so android/jni/
      - name: Upload JNI library
        uses: actions/upload-artifact@v4
        with:
          name: libstardew_view-jni
          path: android/jni/libstardew_view.so