# Android Gradle integration for the stardew-view native library.

apply plugin: 'com.android.library'

android {
    namespace 'io.stardew.view'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName "0.30"

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
}