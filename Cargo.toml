[package]
name = "stardew-view"
version = "0.30.0"
edition = "2021"
authors = ["Stardewdevs"]
description = "GPU-accelerated renderer for Stardew terminal"
license = "Apache-2.0"
repository = "https://github.com/stardewdevs/stardew-view"
homepage = "https://github.com/stardewdevs/stardew-view"
documentation = "https://github.com/stardewdevs/stardew-view/docs"

[dependencies]
alacritty_terminal = "0.25"
stardew-emulator = { path = "../stardew-emulator", optional = true }
sugarloaf = "0.8"
webgpu = "0.19"
wgpu = "0.19"
crossfont = "0.8"
glyphon = "0.6"
glam = "0.29"
cgmath = "0.18"
jni = { version = "0.21", optional = true }
jni-sys = { version = "0.3", optional = true }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", optional = true }
ndk-sys = { version = "0.6", optional = true }
glue = { version = "0.3", optional = true }
android-activity = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:jni"]
android = ["ndk", "ndk-sys", "glue", "android-activity"]
