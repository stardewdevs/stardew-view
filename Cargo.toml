[package]
name = "stardew-view"
version = "0.30.0"
edition = "2021"
authors = ["Stardewdevs"]
description = "GPU-accelerated renderer for Stardew terminal"
license = "Apache-2.0"
repository = "https://github.com/stardewdevs/stardew-view"
homepage = "https://github.com/stardewdevs/stardew-view"
documentation = "https://github.com/stardewdevs/stardew-view/docs"

[dependencies]
stardew-emulator = { git = "https://github.com/stardewdevs/stardew-emulator", default-features = false }
wgpu = "0.19.3"
glyphon = "0.5.0"
glam = "0.29.0"
anyhow = "1.0.95"
thiserror = "2.0.11"
log = "0.4.26"
env_logger = "0.11.6"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
toml = "0.8.20"
lazy_static = "1.5.0"
jni = { version = "0.21.0", optional = true }
jni-sys = { version = "0.3.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", optional = true }
ndk-sys = { version = "0.6.0", optional = true }
glue = { version = "0.3.0", optional = true }
android-activity = { version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = "3.14.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:jni"]
android = ["dep:ndk", "dep:ndk-sys", "dep:glue", "dep:android-activity"]
metal = []
